<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the.room - Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome-free-6.7.2-web/css/all.min.css') }}">
</head>
<body>
    <div class="main-container">
        <div class="navigation">
            <div class="left">

                <div class="buttons">
                    <button title="Exit Room" class="closeBtn"></button>
                    <button title="Minimize window" class="minimizeBtn"></button>
                    <button title="Maximize Window" class="maximizeBtn"></button>
                </div>
                <span>
                </span>
                
            </div>

            <div class="right">
                <div class="buttons">
                    <div class="dropdown">
                        <button onclick="toggleDropdown()" title="View the available activities" id="dropdownBtn" class="dropdownBtn"><i class="fas fa-bars"></i></button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <button onclick="window.location.href='{{ url_for('index') }}'" style="border-top-left-radius: 10px !important; border-top-right-radius: 10px !important;" class="watchMovieBtn"><i class="fas fa-film"></i> Watch a Movie</button>
                            <button class="watchMovieBtn"><i class="fas fa-question-circle"></i>  Movie Suggestions</button>
                            <button onclick="window.location.href='{{ url_for('upload') }}'" style="border-bottom-left-radius: 10px !important; border-bottom-right-radius: 10px !important;" class="watchMovieBtn"><i class="fas fa-upload"></i> Upload</button>

                        </div>
                    </div>
                    <button title="Send message" class="chatCallBtn"><i class="fas fa-message"></i> Open Chat</button>
                    <button title="Voice Call" class="phoneCallBtn"><i class="fas fa-phone"></i> Voice Call</button>
                    <button title="Video Call" class="videoCallBtn"><i class="fas fa-video"></i> Video Call</button>
                </div>
            </div>
        </div>

        <div id="movies" class="section movies-section">
            <div class="section-header">
                <div>
                    <h1><i class="fas fa-upload"></i> Upload a Movie</h1>
                    <p><i class="fas fa-quote-left"></i> <span id="homeMessage"></span></p>
                </div>
                <div>
                    <span id="date-time" class="date-time"></span> 
                    <span id="clock" class="clock"></span>
                </div>
            </div>

            <div class="movies-content">
                <div class="movies-container">
                    
                    
                </div>
            </div>
        </div>
    </div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
